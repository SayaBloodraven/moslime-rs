[package]
name = "moslime"
version = "0.2.0"
edition = "2021"

[dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tokio-util = "0.7"
futures = "0.3"
anyhow = "1"
half = "2"
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.29", optional = true }

[features]
# The desktop window. For a headless machine (Raspberry Pi) build with:
#   cargo build --release --no-default-features
default = ["gui"]
gui = ["dep:eframe"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Foundation", "Win32_System_WinRT"] }

[profile.release]
lto = true
strip = true
